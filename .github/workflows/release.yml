name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      body: ${{ steps.cliff.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the binary itself is pinned by digest; bumped by hand, dependabot does not track it
      - env:
          CLIFF: git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$CLIFF" "https://github.com/orhun/git-cliff/releases/download/v2.14.2/$CLIFF"
          echo "$SHA512  $RUNNER_TEMP/$CLIFF" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$CLIFF" -C "$RUNNER_TEMP" --strip-components=1
      - id: cliff
        run: |
          {
            echo "body<<NOTES_EOF"
            "$RUNNER_TEMP/git-cliff" --config cliff.toml --latest --strip header
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # bumped by hand; dependabot does not track it
          bun-version: 1.4.4
          # releases build cold, so a poisoned ci cache cannot reach them
          no-cache: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # a stalled ubuntu mirror otherwise hangs the job; this step normally takes under a minute
      - if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev libasound2-dev libvulkan-dev glslc patchelf
      - if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          install_runtime: true
      # a pc without a vulkan driver has no loader, and the app would not start
      - if: runner.os == 'Windows'
        run: |
          mkdir -p src-tauri/target/vulkan
          cp "$(cygpath -u "$VULKAN_SDK")/runtime/x64/vulkan-1.dll" src-tauri/target/vulkan/
      # self-signed, so macOS keeps the microphone and accessibility grants across updates
      - if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=Eckermann Code Signing" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ github.ref_name }}
          releaseName: Eckermann ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          # versionless names, so the site can link releases/latest/download/<file>
          # ponytail: one arch per os; add [arch] when a second one ships
          releaseAssetNamePattern: "[name][ext]"
          # the dmg comes from dmgbuild below
          args: ${{ runner.os == 'macOS' && '--bundles app' || '' }}
      # tauri's dmg gets no window layout on ci, and has no retina background or text size
      - if: runner.os == 'macOS'
        working-directory: src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p target/release/bundle/dmg
          installer/dmg.sh target/release/bundle/macos/Eckermann.app target/release/bundle/dmg/Eckermann.dmg
          codesign --sign "$APPLE_SIGNING_IDENTITY" target/release/bundle/dmg/Eckermann.dmg
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" target/release/bundle/dmg/Eckermann.dmg
      # each leg matches only its own installers
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out -p '*.dmg' -p '*.AppImage' -p '*.deb' -p '*.rpm' -p '*.exe'
          (cd out && sha256sum -- *) > SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS --clobber
