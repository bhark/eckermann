name: ci

on:
  push:
    branches: [main]
  pull_request:
  # also takes installer screenshots for review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # whisper's vulkan shaders make the windows build the slow one
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # bumped by hand; dependabot does not track it
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # a stalled ubuntu mirror otherwise hangs the job; this step normally takes under a minute
      - if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev libasound2-dev libvulkan-dev glslc
      - if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          install_runtime: true
          cache: true
      # the vulkan loader: on the path for the tests, and a bundle resource beside the app
      - if: runner.os == 'Windows'
        run: |
          mkdir -p src-tauri/target/vulkan
          cp "$(cygpath -u "$VULKAN_SDK")/runtime/x64/vulkan-1.dll" src-tauri/target/vulkan/
          cygpath -w "$VULKAN_SDK/runtime/x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test ./src
      # the app embeds dist at compile time
      - run: bun run build
      - working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
      # through tauri's bundler, so a cli bump that breaks the forked installer template fails here
      - if: runner.os == 'Windows'
        run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # started offline, so a missing dll or an early panic fails here and no models download
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Resolve-Path src-tauri/target/release/eckermann.exe).Path
          New-NetFirewallRule -DisplayName eckermann-smoke -Direction Outbound -Program $exe -Action Block | Out-Null
          $app = Start-Process $exe -PassThru
          Start-Sleep 20
          Get-Content "$env:LOCALAPPDATA/dk.forn.eckermann/logs/Eckermann.log" -ErrorAction SilentlyContinue
          if ($app.HasExited) { throw "eckermann exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        run: src-tauri/installer/windows/shots.ps1
      # the dmg window in light and dark appearance
      - if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        working-directory: src-tauri
        run: |
          bun run tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
          mkdir -p ../shots
          installer/dmg.sh target/release/bundle/macos/Eckermann.app target/Eckermann.dmg
          hdiutil attach -nobrowse target/Eckermann.dmg
          for appearance in light dark; do
            if [ $appearance = dark ]; then defaults write -g AppleInterfaceStyle Dark; else defaults delete -g AppleInterfaceStyle || true; fi
            killall Finder || true
            sleep 3
            open /Volumes/Eckermann
            sleep 3
            screencapture -x "../shots/dmg-in-$appearance.png"
          done
          hdiutil detach /Volumes/Eckermann
      - if: github.event_name == 'workflow_dispatch' && runner.os != 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ runner.os }}
          path: shots
