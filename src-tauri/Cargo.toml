[package]
name = "eckermann"
version = "0.1.1"
description = "Local dictation into any app"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.91"
default-run = "eckermann"

[lib]
name = "eckermann_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
whisper-rs = { version = "0.16", features = ["log_backend"] }
hound = "3.5"
cpal = { version = "0.18", features = ["pulseaudio"] }
rubato = "5"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2.14"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast"] }
futures-channel = "0.3"
futures-util = "0.3"
libc = "0.2"
x11rb = { version = "0.13", features = ["xkb", "xtest"] }
whisper-rs = { version = "0.16", features = ["vulkan"] }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
tauri-plugin-single-instance = "2.5"
windows = { version = "0.62", features = ["Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
